<!-- Generated by scripts/manual/build.py from the firmware README ({{SOURCE}}). Edit the README, not this file. -->
<style>
html{scroll-behavior:smooth;scroll-padding-top:20px}
.m-hero{padding:clamp(28px,6vw,64px) var(--bx-gutter) clamp(28px,4vw,48px);border-bottom:2px solid var(--bx-pink)}
.m-hero .bx-mega{font-size:19vw}
.m-hero .bx-ctas{margin-top:clamp(18px,3vw,28px)}
.m-wrap{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:clamp(24px,4vw,64px);padding:0 var(--bx-gutter)}

/* contents */
.m-toc{position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding:24px 0 40px;scrollbar-width:thin}
.m-toc summary{display:none}
.m-toc input{width:100%;background:#0b0809;border:1.5px solid var(--bx-line);color:var(--bx-ink);font:15px var(--bx-sans);padding:10px 12px;border-radius:0;margin:0 0 14px}
.m-toc input:focus{outline:none;border-color:var(--bx-pink)}
.m-toc h2{margin:0 0 10px;font:700 12px var(--bx-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--bx-muted)}
.m-toc ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--bx-line)}
.m-toc li a{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:7px 0;border-bottom:1px solid var(--bx-line);text-decoration:none;color:#cfc8cd;font-size:14.5px;line-height:1.3}
.m-toc li a span{font:600 11.5px/1.5 var(--bx-mono);color:var(--bx-pink)}
.m-toc li a:hover{color:var(--bx-pink)}
.m-toc li a.on{color:var(--bx-black);background:var(--bx-pink);padding-inline:8px}
.m-toc li a.on span{color:var(--bx-black)}
.m-toc .m-none{display:none;padding:10px 0;color:var(--bx-muted);font-size:14px}

/* article */
.m-doc{min-width:0;padding:8px 0 clamp(40px,6vw,90px);max-width:880px;font-size:17px;line-height:1.65;color:#d9d3d7}
.m-doc>:first-child{margin-top:24px}
.m-doc h2{margin:clamp(56px,7vw,96px) 0 18px;padding-top:18px;border-top:2px solid var(--bx-pink);font-weight:900;font-size:clamp(34px,5vw,64px);line-height:.92;letter-spacing:-.035em;text-transform:uppercase;color:var(--bx-ink)}
.m-doc h3{margin:38px 0 12px;font:800 clamp(19px,1.8vw,23px)/1.2 var(--bx-sans);text-transform:uppercase;letter-spacing:-.005em;color:var(--bx-pink)}
.m-doc h4{margin:28px 0 10px;font:700 13px var(--bx-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--bx-ink)}
.m-doc h2,.m-doc h3,.m-doc h4{position:relative}
.m-anchor{position:absolute;left:-.9em;opacity:0;text-decoration:none;color:var(--bx-muted);font-size:.6em;top:.25em}
.m-doc h2 .m-anchor{top:1.1em}
.m-doc h2:hover .m-anchor,.m-doc h3:hover .m-anchor,.m-doc h4:hover .m-anchor{opacity:1}
.m-doc p{margin:0 0 16px}
.m-doc strong{color:var(--bx-ink);font-weight:750}
.m-doc a{color:var(--bx-pink);text-underline-offset:3px}
.m-doc a:hover{color:var(--bx-ink)}
.m-doc ul,.m-doc ol{margin:0 0 18px;padding-left:1.3em}
.m-doc li{margin:6px 0}
.m-doc li::marker{color:var(--bx-pink)}
.m-doc code{font:600 .88em var(--bx-mono);color:var(--bx-teal);background:#06100f;padding:1px 5px;word-break:break-word}
.m-doc pre{margin:0 0 18px;padding:16px 18px;background:#070707;border-left:3px solid var(--bx-teal);overflow:auto}
.m-doc pre code{background:none;padding:0;color:#bff8ef;font-weight:500;word-break:normal}
.m-doc blockquote{margin:0 0 22px;padding:14px 18px;border-left:3px solid var(--bx-orange);background:#120a03;color:#e9dccf}
.m-doc blockquote p:last-child{margin:0}
.m-doc hr{border:0;border-top:1px solid var(--bx-line);margin:32px 0}
.m-table{overflow-x:auto;margin:6px 0 22px;border-top:1px solid var(--bx-line)}
.m-doc table{border-collapse:collapse;width:100%;font-size:15.5px;line-height:1.5}
.m-doc th{text-align:left;font:700 11.5px var(--bx-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--bx-muted);padding:10px 14px 10px 0;border-bottom:1px solid var(--bx-pink);white-space:nowrap}
.m-doc td{padding:11px 14px 11px 0;border-bottom:1px solid var(--bx-line);vertical-align:top}
.m-doc td:first-child{color:var(--bx-ink);min-width:7em}
.m-doc tr:hover td{background:rgba(255,31,214,.05)}
.m-top{text-align:right;margin:24px 0 0!important}
.m-top a{font:700 11px var(--bx-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--bx-muted);text-decoration:none}
.m-top a:hover{color:var(--bx-pink)}
mark.m-hit{background:var(--bx-pink);color:var(--bx-black)}

@media (max-width:960px){
  html{scroll-padding-top:64px}
  .m-wrap{grid-template-columns:1fr;gap:0}
  .m-toc{position:sticky;top:0;z-index:5;max-height:none;padding:0;background:var(--bx-black);border-bottom:1px solid var(--bx-line);margin:0 calc(-1 * var(--bx-gutter));padding:0 var(--bx-gutter)}
  .m-toc summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;padding:14px 0;font:700 12px var(--bx-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--bx-pink)}
  .m-toc summary::-webkit-details-marker{display:none}
  .m-toc summary b{color:var(--bx-ink);font-weight:700;max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m-toc:not([open]) .m-toc-body{display:none}
  .m-toc-body{max-height:60vh;overflow:auto;padding-bottom:14px}
  .m-toc h2{display:none}
  .m-anchor{display:none}
}
</style>
<script src="/assets/site.js"></script>
</head>
<body class="bx" data-bx-page="bribeluge" data-bx-foot>
<div id="top"></div>
<header class="m-hero">
  <p class="bx-kicker">Bribeluge {{VERSION}} <span>/</span> Deluge firmware <span>/</span> Full manual</p>
  <h1 class="bx-mega bx-glitch" data-text="MANUAL" data-fit><span class="bx-fit">MANUAL</span></h1>
  <div class="bx-ctas">
    <a class="bx-btn bx-solid" href="#download">Download</a>
    <a class="bx-btn" href="#install">Install</a>
    <a class="bx-btn" href="#quick-reference">Quick reference</a>
    <a class="bx-btn" href="/bribeluge/">Feature overview</a>
  </div>
</header>

<div class="m-wrap">
  <details class="m-toc" id="toc" open>
    <summary><span>Contents</span><b id="tocNow"></b></summary>
    <div class="m-toc-body">
      <h2>Contents</h2>
      <input type="search" id="tocFilter" placeholder="Filter sections" aria-label="Filter sections">
      <ol id="tocList">
{{TOC}}
      </ol>
      <p class="m-none" id="tocNone">No matching section.</p>
    </div>
  </details>
  <article class="m-doc" id="doc">
{{BODY}}
  </article>
</div>

<script>
(function(){
  var toc = document.getElementById("toc"), list = document.getElementById("tocList"), now = document.getElementById("tocNow");
  var links = Array.prototype.slice.call(list.querySelectorAll("a"));
  var narrow = matchMedia("(max-width:960px)");
  function setOpen(){ toc.open = !narrow.matches; }
  setOpen(); narrow.addEventListener("change", setOpen);
  // close the phone contents after picking a section
  list.addEventListener("click", function(){ if (narrow.matches) toc.open = false; });

  // filter the contents by section name or by words inside the section
  var heads = links.map(function(a){ return document.getElementById(a.getAttribute("href").slice(1)); });
  var texts = heads.map(function(h){
    var t = "", n = h && h.nextElementSibling;
    while (n && n.tagName !== "H2") { t += " " + n.textContent; n = n.nextElementSibling; }
    return (h ? h.textContent : "") + " " + t;
  }).map(function(s){ return s.toLowerCase(); });
  document.getElementById("tocFilter").addEventListener("input", function(e){
    var q = e.target.value.trim().toLowerCase(), any = false;
    links.forEach(function(a, i){ var hit = !q || texts[i].indexOf(q) >= 0; a.parentNode.style.display = hit ? "" : "none"; any = any || hit; });
    document.getElementById("tocNone").style.display = any ? "none" : "block";
  });

  // highlight the section you're reading
  var current = null;
  function mark(i){
    if (current === i) return; current = i;
    links.forEach(function(a, j){ a.classList.toggle("on", j === i); });
    now.textContent = i >= 0 ? links[i].lastChild.textContent.trim() : "";
    if (i >= 0 && !narrow.matches) {
      var a = links[i], box = toc;
      if (a.offsetTop < box.scrollTop + 60 || a.offsetTop > box.scrollTop + box.clientHeight - 60) box.scrollTop = a.offsetTop - box.clientHeight / 3;
    }
  }
  function onScroll(){
    var y = innerHeight * 0.25, idx = -1;
    for (var i = 0; i < heads.length; i++) { if (heads[i] && heads[i].getBoundingClientRect().top <= y) idx = i; else break; }
    mark(idx);
  }
  addEventListener("scroll", onScroll, { passive: true }); onScroll();
})();
</script>
</body>
</html>
