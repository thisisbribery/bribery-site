<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bribeluge Companion has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.thisisbribery.com/bribeluge/companion/">
<script>
// The Companion moved under Bribeluge. Installed home-screen copies go straight to the app; everyone else
// lands on the info page. Query and #bx-import= fragment carry over (same origin, so saved settings stay).
(function () {
  var app = window.matchMedia && (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches);
  location.replace((app ? "/bribeluge/companion/launch/" : "/bribeluge/companion/") + location.search + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/bribeluge/companion/"></noscript>
<style>body{background:#000;color:#fff;font:16px system-ui,sans-serif;padding:24px}a{color:#ff1fd6}</style>
</head>
<body>
<p>The Bribeluge Companion has moved to <a href="/bribeluge/companion/">thisisbribery.com/bribeluge/companion</a>.</p>
</body>
</html>
